name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: true
    env:
      # Account IDs are identifiers, not credentials. Keeping it here avoids
      # accidentally using the D1 database UUID as the account ID.
      CLOUDFLARE_ACCOUNT_ID: "580ebd9b063694fcc64df5c9e864da22"
      VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply mymanager-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure Web Push private key
        if: ${{ env.VAPID_PRIVATE_JWK != '' }}
        run: printf '%s' "$VAPID_PRIVATE_JWK" | npx wrangler secret put VAPID_PRIVATE_JWK
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure Web Push subject
        if: ${{ env.VAPID_SUBJECT != '' }}
        run: printf '%s' "$VAPID_SUBJECT" | npx wrangler secret put VAPID_SUBJECT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
